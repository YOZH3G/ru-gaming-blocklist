name: Update Darktide AWS ranges

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh Darktide AWS ranges
        run: python scripts/update_darktide_aws.py

      - name: Validate production lists
        run: python scripts/validate_blocklists.py

      - name: Commit changes
        run: |
          if git diff --quiet -- games/Darktide.txt; then
            echo "Darktide AWS ranges are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/Darktide.txt
          git commit -m "Update Darktide AWS ranges"
          git push
